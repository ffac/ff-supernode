---
servername: bgp-test

public_ffrl_ipv4: "185.66.193.46/32"
public_ffrl_ipv6: "2a03:2260:3006:a157::/56"
# cloud-init config
networkd_interfaces:
  - name: lo
    addresses:
      - "{{ public_ffrl_ipv4 }}"
      - "{{ public_ffrl_ipv6 }}"
    routing_policies:
      - from: "{{ public_ffrl_ipv6 }}"
        table: 42
      - from: "{{ public_ffrl_ipv4 }}"
        table: 42
  - name: eth0
    addresses:
      - 2a00:fe0:43::157/64
    gateway6: 2a00:fe0:43::1
    dns_server:
      - 9.9.9.9
      - '2a03:2260:3006::53'
  - name: eth1
    addresses:
      - 100.64.17.157/24

