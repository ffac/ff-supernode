---
servername: sn03
sn: 03

public_ffrl_ipv4: "185.66.193.45/32"
public_ffrl_ipv6: "2a03:2260:3006:300::/56"
# cloud-init config
networkd_interfaces:
  - name: lo
    addresses:
      - "{{ public_ffrl_ipv4 }}"
      - "{{ public_ffrl_ipv6 }}"
    routing_policies:
      # rule for ipv4 ffrl
      - from: "{{ public_ffrl_ipv4 }}"
        table: 42
      # rule for ipv4 client network
      - from: "10.0.0.0/11"
        table: 42
      - from: "{{ public_ffrl_ipv6 }}"
        table: 42
  - name: eth0
    fixed_mac: bc:24:11:cb:d3:58
    # the vx-*-server tunnels use this interface's public addresses as
    # their VXLAN local/remote endpoint, so they are stacked here and
    # nowhere else
    vxlan: true
    # addresses, gateway and DNS are static, there is no router
    # advertisement to wait for - waiting for one holds the link ~13 s
    no_radv_accept: True
    addresses:
      - 5.145.135.153/27
      - 2a00:fe0:43::203/64
    gateway4: 5.145.135.129
    gateway6: 2a00:fe0:43::1
    dns_server:
      - 9.9.9.9
      - "2a03:2260:3006::53"
    nat4_bgp: True
    nat4: False
    nat6: False
    static_routes:
      - destination: "5.145.135.128/27"
        table: 42
      - destination: "2a00:fe0:43::/64"
        table: 42
    routing_policies:
      - from: "2a03:2260:3006:100::/56"
        table: 42
      - from: "2a03:2260:3006:200::/56"
        table: 42
      - from: "2a03:2260:3006:300::/56"
        table: 42
      - from: "185.66.193.45/32"
        table: 42
      - from: "10.0.0.0/11"
        table: 42
      # The parker pool is routed in bird's table 42, and the packets Jool
      # translates back carry 64:ff9b:: as their source, so the `from` rules
      # above never match them. Without this destination-based rule the kernel
      # looks the pool up in main, finds no route there, and sends the return
      # path to the backbone default instead of the tunnel.
      - to: "{{ parker_pool6 }}"
        table: 42
        # clear of the auto-assigned block (3276x) and above the kernel's
        # `from all lookup main` at 32766, which would otherwise win
        priority: 32750
      # ... and the forward direction needs the same push: traffic sourced
      # from a pool address is the node talking to the outside world. The pool
      # is announced to FFRL, not to the site uplink, so only the backbone link
      # has a path back. Left to main the packet leaves via eth0 and the answer
      # either never returns or is dropped as spoofed at the site uplink's
      # ingress filter.
      - from: "{{ parker_pool6 }}"
        table: 42
        # ahead of the `to` rule so a node-to-node flow uses one table either
        # way, and still above `from all lookup main`
        priority: 32749
  - name: ens19
    # IPv4 only, no router advertisement on this link either
    no_radv_accept: True
    nat4_bgp: True
    addresses:
      - 100.64.17.153/24

bat_clamp_mss: True

bird:
  router_id: 5.145.135.153
  kernel:
    - is_ipv6: no
      ip_table: 42
      exports:
        - "filter filter_kernel_v4"
    - is_ipv6: yes
      ip_table: 42
      # ff.parker_concentrator writes the delegated /64s into table 42 with
      # `ip route replace`. bird ignores routes it did not install itself
      # unless it is told to learn them: without this the prefixes sit in 42,
      # reach neither master6 nor OSPF, and nothing forwards to them. The
      # import filter keeps table 42 from feeding arbitrary routes into our
      # announcements - only the parker pool is taken over.
      learn: true
      imports:
        - "filter accept_parker_pool_v6"
      # bird_table: auxtable
      exports:
        - "filter filter_kernel_v6"
  ospf:
    - version: v2
      name: IGP
      is_ipv6: no
      imports:
        - "all"
      exports:
        - "filter reject_internal_prefixes_v4"
        - "filter accept_public_prefix_v4"
      area:
        - id: 0
          interfaces:
            - name: lo
              stub: yes
            - name: ens19
              cost: 10
              hello: 5
              retransmit: 2
              wait: 10
              dead: 20
              check: link
              authentication: "none"
    - version: v3
      name: IGP6
      is_ipv6: yes
      imports:
        - "all"
      exports:
        - "filter reject_internal_prefixes_v6"
        - "filter accept_public_prefix_v6"
      area:
        - id: 0
          interfaces:
            - name: lo
              stub: yes
            - name: ens19
              cost: 10
              hello: 5
              retransmit: 2
              wait: 10
              dead: 20
              check: link
              authentication: "none"
  filter:
    - name: reject_internal_prefixes_v4
      default_accept: yes
      rules:
        - "if net ~ [100.64.17.0/24+, 5.145.135.128/27+, 10.0.0.0/8+] then reject;"
    - name: accept_public_prefix_v4
      default_accept: no
      rules:
        - "if net ~ [185.193.64.40/29+] then accept;"
    - name: reject_internal_prefixes_v6
      default_accept: yes
      rules:
        - "if net ~ [2a00:fe0:43::/48+, 2a03:2260:3006:300::/56] then reject;"
    - name: accept_public_prefix_v6
      default_accept: no
      rules:
        - "if net ~ [2a03:2260:3006::/48+] then accept;"
    - name: accept_parker_pool_v6
      # Import filter of the kernel protocol: the parker reconciler adds one
      # /64 per node to table 42 without telling bird. `learn` picks them up,
      # this filter decides which ones are ours.
      default_accept: no
      rules:
        - "if net ~ [{{ parker_pool6 }}+] then accept;"
    - name: filter_kernel_v4
      default_accept: yes
      rules:
        - "if net ~ [100.64.17.0/24+, 5.145.135.128/27+, 10.0.0.0/8+] then reject;"
        - "krt_prefsrc={{ public_ffrl_ipv4.split('/') | first }};"
    - name: filter_kernel_v6
      default_accept: yes
      rules:
        - "if net ~ [2a00:fe0:43::/48+, 2a03:2260:3006:300::/56{56,64}] then reject;"

client_dns_server_v4: 5.145.135.158
client_dns_server_v6: 2a00:fe0:43::158

# ffrl prefix
mesh_prefix: "2a03:2260:3006"
radv_announce_default: true

#local_vxlan_supernode: 2a00:fe0:43::201
#remote_vxlan_supernode: 2a00:fe0:43::202
yanic_central: "true"

# parker uplink (playbooks/parker.yml): the address NAT64 masks translated
# flows with - eth0's public IPv4, whose return path is already routed here
parker_pool4: "5.145.135.153/32"

# Parker config service. The broker itself comes from playbooks/broker.yml;
# `monitor` keeps its instance for images that still have
# wg-broker.freifunk-aachen.de baked in. Without enabled: true this block
# changes nothing on sn03. usign_secret is the vaulted key content the role
# writes to wgbroker_parker_secret_key.
wgbroker_parker:
  usign_secret: "{{ parker_usign_secret }}"

# site.conf sends both broker endpoints (add_key, /config) here, so the role
# brings its own nginx vhost and certificate (playbooks/broker.yml).
wgbroker_vhost: 03.wg-node.freifunk-aachen.de
