---

- name: "Check required variables"
  ansible.builtin.assert:
    that:
      - sn is defined
      - domains is defined
      - client_dns_server_v4 is defined
    fail_msg: "kea_dhcp4_server needs sn, domains and client_dns_server_v4"

- name: "Install python3-debian for deb822_repository"
  ansible.builtin.apt:
    name: python3-debian
    update_cache: true
    cache_valid_time: 3600

# older versions of this role added the repository as a .list file and
# downloaded the key by hand
- name: "Find old ISC Kea repository files"
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "dl_cloudsmith_io_public_isc_kea_*.list"
  register: old_kea_repositories

- name: "Remove old ISC Kea repository files"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ old_kea_repositories.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: "Remove old ISC Kea repository key"
  ansible.builtin.file:
    path: "/etc/apt/keyrings/{{ item }}"
    state: absent
  loop:
    - isc-kea-cloudsmith.asc
    - isc-kea-cloudsmith.asc.bak

- name: "Add ISC Kea repository"
  register: "iscrepositoryadded"
  ansible.builtin.deb822_repository:
    name: isc-kea
    types: deb
    uris: "https://dl.cloudsmith.io/public/isc/{{ kea_repo_series }}/deb/debian"
    suites: "{{ ansible_distribution_release }}"
    components: main
    architectures: amd64
    signed_by: "https://dl.cloudsmith.io/public/isc/{{ kea_repo_series }}/gpg.{{ kea_repo_keys[kea_repo_series] }}.key"

- name: "Update apt cache to get isc packages"
  ansible.builtin.apt:
    update_cache: true
  when: "iscrepositoryadded is changed or old_kea_repositories.files | length > 0"

# isc-kea-dhcp4-server is only a transitional package, the unit comes with
# isc-kea-dhcp4. After changing kea_repo_series run once with
# kea_package_state: latest to switch to the new series.
- name: "Install isc-kea-dhcp4"
  register: "keainstall"
  ansible.builtin.apt:
    name: "isc-kea-dhcp4"
    state: "{{ kea_package_state }}"
  when: not ansible_check_mode

- name: "Remove SYSV init script"
  ansible.builtin.file:
    path: "/etc/init.d/isc-kea-dhcp4-server"
    state: "absent"

- name: "Add a ramdisk entry in fstab"
  notify: "Restart isc-kea-dhcp4-server"
  ansible.posix.mount:
    name: "/var/lib/kea"
    src: "tmpfs"
    fstype: "tmpfs"
    # with flaky clients which do not stop sending lease requests, 10M is not enough
    # resulting in DHCP service stopping
    opts: "defaults,size=64M"
    state: "mounted"

- name: "Generate kea-dhcp4.conf config"
  notify: "Reload isc-kea-dhcp4-server"
  ansible.builtin.template:
    src: "kea-dhcp4.conf.j2"
    dest: "/etc/kea/kea-dhcp4.conf"
    mode: "0644"
    owner: "_kea"
    group: "_kea"
    validate: "/usr/sbin/kea-dhcp4 -t %s"

# older versions of this role created an unused drop-in directory
- name: "Remove unused isc-kea-dhcp4-server.service.d directory"
  ansible.builtin.file:
    path: "/etc/systemd/system/isc-kea-dhcp4-server.service.d"
    state: "absent"

- name: "Start isc-kea-dhcp4-server service"
  ansible.builtin.systemd:
    name: "isc-kea-dhcp4-server"
    state: "started"
    enabled: "yes"
    daemon_reload: "yes"
