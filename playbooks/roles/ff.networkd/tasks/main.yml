---

- name: Install systemd-resolved
  ansible.builtin.apt:
    update_cache: true
    name: "systemd-resolved"

- name: "Sysctl: net.ipv6.conf.all.disable_ipv6 to 0"
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.disable_ipv6
    value: "0"
    sysctl_file: /etc/sysctl.d/10-ipv6.conf
    reload: true

- name: "Sysctl: net.ipv6.conf.default.disable_ipv6 to 0"
  ansible.posix.sysctl:
    name: net.ipv6.conf.default.disable_ipv6
    value: "0"
    sysctl_file: /etc/sysctl.d/10-ipv6.conf
    reload: true

- name: Obtain systemd version
  ansible.builtin.shell: "systemd --version | head -n 1 | cut -d ' ' -f 2"
  register: systemd_version
  check_mode: false
  changed_when: false

- name: Print systemd version
  ansible.builtin.debug:
    msg: "Systemd version is {{ systemd_version.stdout }}"

# Disabling ManageForeignRoutes is only possible in systemd 247 and above.
- name: Ensure systemd version >= 247 for ManageForeignRoutes=no feature
  ansible.builtin.command: /bin/true
  when: not networkd_manage_foreign_routes
  failed_when: (systemd_version.stdout | int) < 247
  check_mode: false
  changed_when: false

- name: Install /etc/systemd/networkd.conf
  notify: Restart networkd
  ansible.builtin.template:
    dest: /etc/systemd/networkd.conf
    src: networkd.conf.j2

- name: Enable systemd-networkd
  ansible.builtin.service:
    name: systemd-networkd
    enabled: true
    state: started
  # networkd does not remove any existing network configuration,
  # so this should be safe.

- name: Enable systemd-resolved
  ansible.builtin.service:
    name: systemd-resolved
    enabled: true
    state: started

- name: Enable dns resolving with systemd-resolved
  register: restartresolved
  ansible.builtin.file:

    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: "yes"
# networkd hands a stacked netdev to exactly one link: whichever requests it
# first. Every other requester keeps waiting for a netdev "that is not
# created", never reaches the configured state, and systemd-networkd-wait-online
# then blocks for its full timeout on every boot. So the netdevs may be
# declared by exactly one interface.
- name: "Check that exactly one interface carries the VXLAN netdevs"
  when: "'supernodes' in group_names"
  ansible.builtin.assert:
    that: >-
      networkd_interfaces | selectattr('vxlan', 'defined') | selectattr('vxlan')
      | list | length == 1
    fail_msg: >-
      Interfaces with vxlan: true on {{ inventory_hostname }}:
      {{ networkd_interfaces | selectattr('vxlan', 'defined') | selectattr('vxlan')
         | map(attribute='name') | list }}. Exactly one interface must carry
      the vx-*-server netdevs, otherwise systemd-networkd-wait-online hangs
      for two minutes at every boot.
    quiet: true

- name: Install iface configs
  register: networkd_iface_configs
  ansible.builtin.template:
    src: 1x-iface.network.j2
    dest: /etc/systemd/network/10-{{ interface.name }}.network
  loop: "{{ networkd_interfaces }}"
  loop_control:
    loop_var: interface

- name: Install iface link config
  register: networkd_iface_links
  ansible.builtin.template:
    src: 1x-iface.link.j2
    dest: /etc/systemd/network/10-{{ interface.name }}.link
  loop: "{{ networkd_interfaces }}"
  loop_control:
    loop_var: interface
  when: interface.fixed_mac | default('', true) | length > 0

- name: Remove fixed mac config
  register: networkd_removed_mac_links
  ansible.builtin.file:
    path: "/etc/systemd/network/10-{{ interface.name }}.link"
    state: "absent"
  loop: "{{ networkd_interfaces }}"
  loop_control:
    loop_var: interface
  when: interface.fixed_mac | default('', true) | length == 0

- name: Directly restart networkd
  ansible.builtin.service:
    name: systemd-networkd
    state: restarted
  when: >-
    networkd_iface_configs is changed or
    networkd_iface_links is changed or
    networkd_removed_mac_links is changed

- name: Directly restart resolved
  ansible.builtin.service:
    name: systemd-resolved
    state: restarted
  when: restartresolved is changed
