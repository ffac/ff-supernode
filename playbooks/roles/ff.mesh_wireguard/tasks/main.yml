---

- name: Install wireguard
  ansible.builtin.apt:
    name: wireguard
    update_cache: true
    cache_valid_time: 3600

- name: Ensure wireguard config directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    # 0755 is the mode ff.mesh_wireguard_remotes_peers_git needs: it creates
    # /etc/wireguard/peers-wg as the unprivileged auto user, which has to
    # traverse this directory. The private keys stay 0640 root:systemd-network;
    # the directory mode only exposes the file names.
    mode: "0755"
    owner: "root"
    group: "systemd-network"

- name: Domain configs (supernode)
  ansible.builtin.include_tasks: per_domain.yml
  with_items: "{{ domains }}"
  loop_control:
    loop_var: domain
  when: domains is defined

- name: Establish netlink worker
  ansible.builtin.include_tasks: netlink.yml
