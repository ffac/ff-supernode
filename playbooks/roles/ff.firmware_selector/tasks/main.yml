---
- name: Install git
  ansible.builtin.apt:
    update_cache: true
    name: "{{ packages }}"
  vars:
    packages:
      - git

- name: Clone firmware selector
  ansible.builtin.git:
    repo: "{{ firmware_selector_repo }}"
    dest: /var/www/gluon-firmware-selector
    version: "{{ firmware_selector_version }}"
    # devices.js and config.js are overwritten below, discard them before updating
    force: true
    accept_hostkey: true

- name: Install devices.js
  ansible.builtin.template:
    src: devices.js
    dest: /var/www/gluon-firmware-selector/devices.js

- name: Install config.js
  ansible.builtin.template:
    src: config.js
    dest: /var/www/gluon-firmware-selector/config.js
