---
# Concentrator side of the parker uplink: one wireguard interface whose
# peers and prefix routes follow the parker/ records in the parker registry
# (a repository of its own, not the batman peer list). The broker
# (ff.wgbroker) hands those records out over /config.

- name: Assert parker concentrator variables
  ansible.builtin.assert:
    that:
      - parker_prefix6 | length > 0
      - parker_address6 | length > 0
      - parker_privatekey | length > 0
    fail_msg: "parker_prefix6, parker_address6 and parker_privatekey are required"
    quiet: true

- name: Install python3, pyroute2 and wireguard-tools
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - python3
      - python3-pyroute2
      - wireguard-tools

- name: Ensure wireguard config directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    mode: u=rwx,g=rx,o=rx
    owner: root
    group: systemd-network

- name: Create parker privatekey file (DIFF REDACTED)
  ansible.builtin.copy:
    content: "{{ parker_privatekey }}"
    dest: "/etc/wireguard/privatekey-{{ parker_iface }}"
    mode: "0640"
    owner: root
    group: systemd-network
  no_log: true
  diff: "{{ show_secret_diffs }}"

- name: Generate parker netdev (DIFF REDACTED)
  ansible.builtin.template:
    src: parker.netdev.j2
    dest: "/etc/systemd/network/31-{{ parker_iface }}.netdev"
    mode: "0644"
    owner: root
    group: systemd-network
  diff: "{{ show_secret_diffs }}"
  notify: Restart networkd

- name: Generate parker network
  ansible.builtin.template:
    src: parker.network.j2
    dest: "/etc/systemd/network/31-{{ parker_iface }}.network"
    mode: "0644"
  notify: Restart networkd

- name: Ensure the parker library directory
  ansible.builtin.file:
    path: /usr/local/lib/parker
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Install parker helper library
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/parker_lib.py"
    dest: /usr/local/lib/parker/parker_lib.py
    mode: "0644"
    owner: root
    group: root

- name: Install parker peer reconciler
  ansible.builtin.template:
    src: autoupdate_parker.py.j2
    dest: /usr/local/sbin/autoupdate_parker.py
    mode: "0755"
    owner: root
    group: root

- name: Install cron
  ansible.builtin.apt:
    name: cron

- name: Install crontab for the parker peer reconciler
  ansible.builtin.cron:
    name: "autoupdate parker peers from git"
    user: root
    minute: "*/1"
    # Cron would mail whatever the script prints; the journal is where we look
    # for what a pass did.
    job: /usr/local/sbin/autoupdate_parker.py 2>&1 | logger -t autoupdate_parker
