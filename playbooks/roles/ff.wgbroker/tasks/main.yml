---

- name: Install python3, git
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name: "{{ packages }}"
  vars:
    packages:
      - python3
      - git

- name: Create auto user
  register: createuser
  ansible.builtin.user:
    name: auto
    system: true
    generate_ssh_key: true

- name: Create the peers directory
  ansible.builtin.file:
    state: directory
    dest: /etc/wireguard/peers-wg
    owner: auto

- name: Create lockfile to wait until ssh key is deployed to the git server
  ansible.builtin.file:
    path: /home/auto/wait_for_access.lock
    state: touch
  when: createuser is changed

- name: Wait until the ssh key is deployed to the git server and /home/auto/wait_for_access.lock is removed manually
  ansible.builtin.wait_for:

    path: /home/auto/wait_for_access.lock
    state: absent
- name: Clone the peers git
  become: true
  become_user: auto
  ansible.builtin.git:
    repo: "{{ git_addr }}/peers-wg"
    dest: /etc/wireguard/peers-wg
    accept_hostkey: true
    version: main

- name: Install broker script
  ansible.builtin.template:
    src: broker.py
    dest: /home/auto/broker.py
    mode: u=rwx,g=r,o=r
    owner: auto
    group: auto
  register: updatebroker

- name: Install flask and gunicorn
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - python3-flask
      - gunicorn

- name: Set Git Config Mail
  become: true
  become_user: auto
  community.general.git_config:
    name: user.email
    repo: /etc/wireguard/peers-wg
    scope: local
    value: "auto@{{ dns_searchdomains }}"

- name: Install ssh config
  become: true
  ansible.builtin.template:
    src: sshconfig.j2
    dest: /home/auto/.ssh/config
    mode: "0600"
    owner: "auto"
    group: "auto"
  when: updatebroker is changed

- name: Set Git Config User
  become: true
  become_user: auto
  community.general.git_config:
    name: user.name
    repo: /etc/wireguard/peers-wg
    scope: local
    value: "auto"

# The workers import this at start, so it has to be in place before the
# service is (re)started below.
- name: Install parker helper library
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/parker_lib.py"
    dest: /home/auto/parker_lib.py
    mode: "0644"
    owner: auto
    group: auto
  register: updateparkerlib

- name: Install broker service
  ansible.builtin.template:
    src: wgbroker.service.j2
    dest: /etc/systemd/system/wgbroker.service
  register: servicefile

- name: Enable wgbroker service
  ansible.builtin.systemd:
    name: wgbroker.service
    state: restarted
    daemon_reload: true
    enabled: true
  when: servicefile is changed or updatebroker is changed
        or updateparkerlib is changed

# parker config service (GET /config), see defaults/main.yml

- name: Install the parker config signer
  ansible.builtin.apt:
    name: "{{ wgbroker_parker_signer }}"
  when: wgbroker_parker.get('enabled', false) | bool

- name: Ensure the signing key directory
  ansible.builtin.file:
    path: "{{ wgbroker_parker_secret_key | dirname }}"
    state: directory
    owner: auto
    group: auto
    mode: "0750"
  when: wgbroker_parker.get('enabled', false) | bool

- name: Install parker signing key
  ansible.builtin.copy:
    content: "{{ wgbroker_parker.usign_secret }}"
    dest: "{{ wgbroker_parker_secret_key }}"
    mode: "0600"
    owner: auto
    group: auto
    directory_mode: "0750"
  no_log: true
  when: wgbroker_parker.get('enabled', false) | bool

# The registry is a repository of its own, so the parker records never mix
# with the batman peer keys in peers-wg. Local only unless a remote is set:
# the broker then commits here and the concentrators read the same tree.
- name: Create the parker registry directory
  ansible.builtin.file:
    path: "{{ wgbroker_parker_repo }}"
    state: directory
    owner: auto
    group: auto
    mode: "0750"
  when: wgbroker_parker.get('enabled', false) | bool

# git init has no module (the git module clones, it does not create), and a
# local registry needs no clone.
- name: Initialise the parker registry repository
  become: true
  become_user: auto
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: git init --initial-branch=main .
    chdir: "{{ wgbroker_parker_repo }}"
    creates: "{{ wgbroker_parker_repo }}/.git"
  when: wgbroker_parker.get('enabled', false) | bool

- name: Set the parker registry commit identity
  become: true
  become_user: auto
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    repo: "{{ wgbroker_parker_repo }}"
    scope: local
  loop:
    - { name: user.name, value: "auto" }
    - { name: user.email, value: "auto@{{ dns_searchdomains }}" }
  when: wgbroker_parker.get('enabled', false) | bool

- name: Install parker garbage collector
  ansible.builtin.template:
    src: parker_gc.py.j2
    dest: /home/auto/parker_gc.py
    mode: "0744"
    owner: auto
    group: auto
  when: wgbroker_parker.get('enabled', false) | bool
        and wgbroker_parker.get('gc', {}).get('enabled', false) | bool

- name: Install crontab for the parker garbage collector
  ansible.builtin.cron:
    name: "parker gc"
    user: auto
    minute: "30"
    hour: "4"
    job: /usr/bin/python3 /home/auto/parker_gc.py
  when: wgbroker_parker.get('enabled', false) | bool
        and wgbroker_parker.get('gc', {}).get('enabled', false) | bool

# Public front, only when the role owns the vhost (wgbroker_vhost). Tagged so
# the certificate and the vhost can be brought up before the broker itself.

- name: Install nginx and certbot
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - nginx
      - certbot
      - cron
  when: wgbroker_vhost | length > 0
  tags: [broker_vhost]

- name: Create the ACME webroot
  ansible.builtin.file:
    path: "{{ wgbroker_acme_webroot }}"
    state: directory
    mode: "0755"
  when: wgbroker_vhost | length > 0
  tags: [broker_vhost]

- name: Check for an existing broker certificate
  ansible.builtin.stat:
    path: /etc/letsencrypt/live/{{ wgbroker_vhost }}/fullchain.pem
  register: wgbroker_cert
  when: wgbroker_vhost | length > 0
  tags: [broker_vhost]

# Only until there is a certificate: the https vhost below carries the same
# port 80 block, and two templates on one file means both report changed on
# every run and nginx reloads for nothing.
- name: Install the broker vhost (http, for the certificate)
  ansible.builtin.template:
    src: wgbroker-vhost-http.conf.j2
    dest: /etc/nginx/sites-available/wgbroker.conf
    mode: "0644"
  notify: Reload nginx
  when:
    - wgbroker_vhost | length > 0
    - not wgbroker_cert.stat.exists
  tags: [broker_vhost]

- name: Enable the broker vhost
  ansible.builtin.file:
    src: /etc/nginx/sites-available/wgbroker.conf
    dest: /etc/nginx/sites-enabled/wgbroker.conf
    state: link
  notify: Reload nginx
  when: wgbroker_vhost | length > 0
  tags: [broker_vhost]

- name: Obtain the broker certificate
  ansible.builtin.command:
    cmd: >-
      certbot certonly --webroot -w {{ wgbroker_acme_webroot }}
      -d {{ wgbroker_vhost }} --non-interactive --agree-tos
      --email {{ info_mail }}
    creates: /etc/letsencrypt/live/{{ wgbroker_vhost }}/fullchain.pem
  when: wgbroker_vhost | length > 0
  tags: [broker_vhost]

- name: Check for the broker certificate
  ansible.builtin.stat:
    path: /etc/letsencrypt/live/{{ wgbroker_vhost }}/fullchain.pem
  register: wgbroker_cert
  when: wgbroker_vhost | length > 0
  tags: [broker_vhost]

# Only with a certificate on disk: an ssl server block that points at a
# missing file keeps nginx from starting at all.
- name: Install the broker vhost (https)
  ansible.builtin.template:
    src: wgbroker-vhost.conf.j2
    dest: /etc/nginx/sites-available/wgbroker.conf
    mode: "0644"
  notify: Reload nginx
  when:
    - wgbroker_vhost | length > 0
    - wgbroker_cert.stat.exists
  tags: [broker_vhost]

- name: Set up certificate renewal
  ansible.builtin.cron:
    name: certbot-renewal
    job: "/bin/bash -lc '/usr/bin/certbot -q renew'"
    minute: "0"
    hour: "14"
  when: wgbroker_vhost | length > 0
  tags: [broker_vhost]
