---

- name: Ensure git
  ansible.builtin.apt:
    update_cache: true
    name: "{{ packages }}"
  vars:
    packages:
      - git
      - acl
      - rsync

- name: Ensure golang
  ansible.builtin.apt:
    name: golang
    default_release: "{{ ansible_distribution_release }}"

- name: Create yanic user
  ansible.builtin.user:
    name: "{{ yanic_user }}"
    group: "{{ yanic_group }}"
    system: true

- name: Install yanic
  become: true
  become_user: "{{ yanic_user }}"
  ansible.builtin.script: /usr/bin/go install {{ yanic_repo_path }}@{{ yanic_tag }}

- name: Ensure persist directory, if needed
  ansible.builtin.file:
    path: "/var/lib/yanic/"
    state: directory
    owner: yanic
  when: yanic_nodes_enabled

- name: Ensure nodes path, if needed
  ansible.builtin.file:
    path: "{{ yanic_nodes_path }}"
    state: directory
    owner: yanic
    group: www-data
  when: yanic_nodes_enabled

- name: Configure yanic (DIFF REDACTED)
  notify: Restart yanic
  ansible.builtin.template:
    src: yanic.conf.j2
    dest: /etc/yanic.conf

- name: Copy systemd service
  notify: Daemon reload
  ansible.builtin.template:
    src: yanic.service.j2
    dest: /lib/systemd/system/yanic.service

- name: Enable yanic
  ansible.builtin.systemd:
    name: yanic
    state: restarted
    enabled: true
    daemon_reload: true
