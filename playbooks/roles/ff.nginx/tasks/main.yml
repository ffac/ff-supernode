---
- name: Remove other http server installs
  ansible.builtin.apt:
    name: apache2
    state: absent

- name: Ensure nginx
  ansible.builtin.apt:
    update_cache: true
    state: latest
    name: "{{ packages }}"
  vars:
    packages:
      - nginx-full
      #      - nginx-extras
      - ssl-cert

- name: Nginx config
  ansible.builtin.template:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf
  register: nginxconfig

- name: Nginx sites config
  ansible.builtin.template:
    src: proxy.conf
    dest: /etc/nginx/sites-available/proxy.conf
  register: nginxconfig

- name: Enable nginx sites config
  ansible.builtin.file:
    src: /etc/nginx/sites-available/proxy.conf
    dest: /etc/nginx/sites-enabled/proxy.conf
    state: link

- name: Delete default config
  ansible.builtin.file:
    state: absent
    path: "{{ item }}"
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/sites-available/default

- name: Create Selfsigned-certs
  become: true
  ansible.builtin.raw: make-ssl-cert generate-default-snakeoil # --force-overwrite

- name: Test nginx config
  become: true
  ansible.builtin.raw: nginx -t

- name: Restart Nginx
  ansible.builtin.systemd:
    name: nginx.service
    state: restarted
    enabled: true
  when: nginxconfig.changed
