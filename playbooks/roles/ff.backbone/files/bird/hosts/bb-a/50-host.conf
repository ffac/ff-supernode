# bb-a's own numbers: router id and the twelve FFRL sessions.
# The import local-pref steers our outbound traffic: 101/100 DUS (this
# host prefers the DUS router a), 90 FRA, 80 BER. Measured 2026-11-12:
# DUS 1.9 ms / 3 hops over Megaport, FRA 4.7 ms / 3 hops over DE-CIX,
# BER 12.1 ms / 5 hops over DE-CIX plus transit.

router id 5.145.135.141;

protocol bgp bb_ber_a from ffrl_exit_v4 {
    description "FFRL bb-a.ak.ber";
    neighbor 100.64.5.230 as 201701;
    source address 100.64.5.231;
    ipv4 { import filter { ffrl_import_v4(80); }; };
};
