# sn03's own numbers: router id and its FFRL addresses. The kernel table 42
# (policy routing for our prefixes) must not learn the node's own mesh
# /56 — it is originated here — and replies leave with the FFRL /32.

router id 5.145.135.153;

filter filter_kernel_v4 {
    if net ~ [100.64.17.0/24+, 5.145.135.128/27+, 10.0.0.0/8+] then reject;
    krt_prefsrc = 185.66.193.45;
    accept;
}
filter filter_kernel_v6 {
    if net ~ [2a00:fe0:43::/48+, 2a03:2260:3006:300::/56{56,64}] then reject;
    accept;
}

protocol kernel {
    ipv4 {
        export filter filter_kernel_v4;
    };
    kernel table 42;
}
protocol kernel {
    ipv6 {
        export filter filter_kernel_v6;
    };
    kernel table 42;
}
