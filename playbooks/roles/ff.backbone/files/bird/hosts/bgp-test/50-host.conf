# bgp-test's own numbers: router id and its FFRL addresses. The
# krt_prefsrc values make replies from this host leave with the FFRL
# address on lo, whatever interface the route picked.

router id 100.64.17.157;

filter filter_kernel_v4 {
    if net ~ [100.64.17.0/24+, 5.145.135.128/27+, 10.0.0.0/8+] then reject;
    krt_prefsrc = 185.66.193.46;
    accept;
}
filter filter_kernel_v6 {
    if net ~ [2a00:fe0:43::/48+] then reject;
    krt_prefsrc = 2a03:2260:3006:a157::;
    accept;
}

protocol kernel {
    ipv4 {
        export filter filter_kernel_v4;
    };
    kernel table 42;
}
protocol kernel {
    ipv6 {
        export filter filter_kernel_v6;
    };
    kernel table 42;
}
