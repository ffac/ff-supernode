# OSPF of a BGP client: it learns the default and the backbone prefixes
# from the backbone routers, and announces its own lo addresses back.
# One export clause is in effect per channel — a second would replace
# the first, so the internal-prefix rejection is left to the accept
# filter's default reject.

protocol ospf v2 IGP {
    ipv4 {
        import all;
        export filter accept_public_prefix_v4;
    };
    area 0 {
        interface "lo" {
            stub yes;
        };
        interface "eth1" {
            cost 10;
            hello 5;
            retransmit 2;
            wait 10;
            dead 20;
            check link;
            authentication none;
        };
    };
}

protocol ospf v3 IGP6 {
    ipv6 {
        import all;
        export filter accept_public_prefix_v6;
    };
    area 0 {
        interface "lo" {
            stub yes;
        };
        interface "eth1" {
            cost 10;
            hello 5;
            retransmit 2;
            wait 10;
            dead 20;
            check link;
            authentication none;
        };
    };
}
