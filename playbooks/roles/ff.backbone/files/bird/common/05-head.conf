# Base for every host using this role: logging, link scan, interface addresses.

log syslog { remote, warning, error, auth, fatal, bug };
log "/var/log/bird/bird.log" { info, remote, warning, error, auth, fatal, bug };
debug protocols all;

protocol device {
    scan time 8;
}

protocol direct {
    interface "*";
    ipv4;
    ipv6;
}
