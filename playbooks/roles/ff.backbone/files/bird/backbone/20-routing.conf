# Kernel tables, OSPF and the uplink host route of a backbone router.

ipv6 table auxtable6;

protocol pipe pipe_hostroute {
    table master6;
    peer table auxtable6;
    import none;
    export filter hostroute_v6;
}

# The kernel's main table. A reply from the internet carries a source
# outside our prefixes, so the policy rule looks it up in main, and main
# has to know our /56s. bird attaches only one kernel protocol per table,
# hence the extra table: pipe_hostroute fills it from master6 through the
# hostroute_v6 filter.
protocol kernel {
    ipv4 {
        export filter filter_kernel_v4;
    };
    kernel table 42;
}
protocol kernel {
    ipv6 {
        export filter filter_kernel_v6;
    };
    kernel table 42;
}
protocol kernel {
    ipv6 {
        table auxtable6;
        export all;
    };
}

# Only the backbone's own prefix. The 3006 /56s, the parker pool among
# them, are originated by their supernodes and arrive over OSPF: a
# backbone that loses its adjacency to a supernode then withdraws that
# /56 instead of announcing it into a reject route.
protocol static uplink_hostroute {
    ipv6 { import all; };
    route 2a03:2260:114:0100::/56 reject;
}

protocol ospf v2 IGP {
    ipv4 {
        import all;
        export filter accept_public_prefix_v4;
    };
    area 0 {
        interface "lo" {
            stub yes;
        };
        interface "wg-*" {
            cost 100;
            type ptp;
            hello 5;
            retransmit 2;
            wait 10;
            dead 20;
            check link;
            authentication none;
        };
        interface "eth1" {
            cost 10;
            hello 5;
            retransmit 2;
            wait 10;
            dead 20;
            check link;
            authentication none;
        };
    };
}

# The supernodes learn their default route from us. Our prefixes come
# the other way: each supernode originates its own.
protocol ospf v3 IGP6 {
    ipv6 {
        import all;
        export where is_default_v6();
    };
    area 0 {
        interface "lo" {
            stub yes;
        };
        interface "wg-*" {
            cost 100;
            type ptp;
            hello 5;
            retransmit 2;
            wait 10;
            dead 20;
            check link;
            authentication none;
        };
        interface "eth1" {
            cost 10;
            hello 5;
            retransmit 2;
            wait 10;
            dead 20;
            check link;
            authentication none;
        };
    };
}
