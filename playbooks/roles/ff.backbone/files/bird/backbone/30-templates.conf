# BGP templates for the FFRL exit sessions. FFRL runs one IPv4 and one
# IPv6 session per tunnel, so each template carries only its own address
# family. The import's local-pref is the session's outbound preference
# (higher wins); the host file overrides it per peer. The same announcement
# goes out on every session, no prepending: FFRL takes the PoP nearest to
# where the traffic enters its network, and every PoP backs up the others.
# One export clause only - a second one would replace the first.

template bgp ffrl_exit_v4 {
    local as 65077;
    multihop 64;
    ipv4 {
        import filter { ffrl_import_v4(100); };
        export where is_our_prefix_v4();
        next hop self;
    };
};

template bgp ffrl_exit_v6 {
    local as 65077;
    ipv6 {
        import filter { ffrl_import_v6(100); };
        export where is_aachen_0114() || is_aachen_3006();
        next hop self;
    };
};
