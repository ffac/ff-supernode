# Functions and filters of the backbone routers.

function is_default_v4() {
    return net ~ [ 0.0.0.0/0 ];
}
function is_default_v6() {
    return net ~ [ ::/0 ];
}

# The FFRL exits' import, parameterized by our outbound preference. The
# bgp_local_pref is forced, not defaulted: it wins regardless of what
# FFRL sends (their IPv4 default came with local-pref 100 on every
# session, leaving the choice to chance). Lower numbers lose.
function ffrl_import_v4(int prio) {
    if is_default_v4() then { bgp_local_pref = prio; accept; } else reject;
}
function ffrl_import_v6(int prio) {
    bgp_local_pref = prio; accept;
}

function is_our_prefix_v4() {
    return net ~ [ 185.66.193.40/29+ ];
}
function is_aachen_0114() {
    return net ~ [ 2a03:2260:114:0100::/56{56,64} ];
}
function is_aachen_3006() {
    return net ~ [ 2a03:2260:3006:0100::/56{56,64}, 2a03:2260:3006:0200::/56{56,64},
                   2a03:2260:3006:0300::/56{56,64}, 2a03:2260:3006:a100::/56{56,64},
                   2a03:2260:3006:8000::/56 ];
}

filter reject_internal_prefixes_v4 {
    if net ~ [100.64.17.0/24+, 5.145.135.128/27+, 10.0.0.0/8+] then reject;
    accept;
}
filter accept_public_prefix_v4 {
    if net ~ [185.66.193.40/29+] then accept;
    reject;
}
filter reject_internal_prefixes_v6 {
    if net ~ [2a00:fe0:43::/48+, 2a03:2260:3006:300::/56] then reject;
    accept;
}
filter accept_public_prefix_v6 {
    if net ~ [2a03:2260:3006::/48+] then accept;
    reject;
}
filter filter_kernel_v4 {
    if net ~ [100.64.17.0/24+, 5.145.135.128/27+, 10.0.0.0/8+] then reject;
    accept;
}
filter filter_kernel_v6 {
    if net ~ [2a00:fe0:43::/48+] then reject;
    # announced to FFRL, never a forwarding entry
    if proto = "uplink_hostroute" then reject;
    accept;
}
filter hostroute_v6 {
    # what the kernel's main table gets (see the auxtable6 kernel below);
    # a bare prefix matches its more specifics too
    if net ~ 2a03:2260:3006:0100::/56 then accept;
    if net ~ 2a03:2260:3006:0200::/56 then accept;
    if net ~ 2a03:2260:3006:0300::/56 then accept;
    if net ~ 2a03:2260:3006:8000::/56 then accept;
    if net ~ 2a03:2260:3006:a100::/56 then accept;
    reject;
}
