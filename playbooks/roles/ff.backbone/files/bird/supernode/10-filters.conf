# Functions and filters of the supernodes. The supernode originates its
# own /56 on lo; what may leave the IGP are the public prefixes. The
# reject_internal filters of the old schema config were dead code — of
# two export clauses bird honors only the last — and are not carried over.

filter accept_public_prefix_v4 {
    if net ~ [185.66.193.40/29+] then accept;
    reject;
}
filter accept_public_prefix_v6 {
    if net ~ [2a03:2260:3006::/48+] then accept;
    reject;
}
