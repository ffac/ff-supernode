# OSPF of a supernode: the default and the backbone prefixes come from
# the backbone routers, the supernode's own /56 and its FFRL /32 go back
# out over lo. ens19 is the link to the backbone segment.

protocol ospf v2 IGP {
    ipv4 {
        import all;
        export filter accept_public_prefix_v4;
    };
    area 0 {
        interface "lo" {
            stub yes;
        };
        interface "ens19" {
            cost 10;
            hello 5;
            retransmit 2;
            wait 10;
            dead 20;
            check link;
            authentication none;
        };
    };
}

protocol ospf v3 IGP6 {
    ipv6 {
        import all;
        export filter accept_public_prefix_v6;
    };
    area 0 {
        interface "lo" {
            stub yes;
        };
        interface "ens19" {
            cost 10;
            hello 5;
            retransmit 2;
            wait 10;
            dead 20;
            check link;
            authentication none;
        };
    };
}
