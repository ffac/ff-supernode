---

- name: Ensure Bird2 is installed
  ansible.builtin.apt:
    name: bird2
    update_cache: true

- name: Start Bird
  ansible.builtin.service:
    name: bird
    enabled: true
    state: started

- name: Ensure Log Directory exists
  ansible.builtin.file:
    path: /var/log/bird/
    state: directory
    mode: "u=rwx,g=rx,o=rx"
    owner: bird
    group: bird

# The config below logs at info level into a single file. Debian ships no
# logrotate entry for bird, so the file only ever grows - 143 MB after ten
# weeks on sn03, on a VM whose disk is 7.8 GB. copytruncate keeps bird's open
# file descriptor usable, no reload needed.
- name: Install Bird logrotate config
  ansible.builtin.copy:
    dest: /etc/logrotate.d/bird
    mode: "0644"
    owner: root
    group: root
    content: |
      /var/log/bird/*.log {
          weekly
          maxsize 50M
          rotate 4
          compress
          delaycompress
          missingok
          notifempty
          copytruncate
          su bird bird
      }

- name: Install Bird Conf
  register: restartbird
  ansible.builtin.template:
    src: bird2.conf.j2
    dest: /etc/bird/bird.conf

- name: Bird Check
  ansible.builtin.command: birdc configure check
  register: bird_health
  failed_when: bird_health.rc != 0
  changed_when: false

- name: Reload Bird Configuration
  ansible.builtin.command: birdc configure
  when: restartbird.changed
