---

- name: Install buildserver dependencies
  ansible.builtin.apt:
    update_cache: true
    name: "{{ packages }}"
  vars:
    packages:
      - bash
      - bzip2
      - curl
      - diffutils
      - file
      - g++
      - gawk
      - gcc
      - git
      - libncurses5-dev
      - libssl-dev
      - libelf-dev
      - make
      - patch
      - perl
      - python3
      - qemu-utils
      - rsync
      - tar
      - unzip
      - wget
      - ecdsautils
      - htop
      - nginx-full
      - nginx-extras

- name: Create user {{ freifunk_site }}
  register: createuser
  ansible.builtin.user:
    name: "{{ freifunk_site }}"
    system: true
    generate_ssh_key: true

- name: Clone site
  become: true
  become_user: "{{ freifunk_site }}"
  ansible.builtin.git:
    repo: "{{ git_addr }}/site.git"
    dest: /mnt/site
    accept_hostkey: true
  register: site
  failed_when:
    - site.failed
    - not 'Local modifications exist in the destination' in site.msg

- name: Clone manifest
  become: true
  become_user: "{{ freifunk_site }}"
  ansible.builtin.git:
    repo: "{{ git_addr }}/manifest.git"
    dest: /mnt/manifest
    accept_hostkey: true
  register: site

- name: Check if buildserver key exists
  become: true
  become_user: "{{ freifunk_site }}"
  ansible.builtin.stat:
    path: ~/.gluon-secret-key
  register: key_exists

- name: Create Buildserver Gluon signing key
  become: true
  become_user: "{{ freifunk_site }}"
  ansible.builtin.raw: ecdsakeygen -s > ~/.gluon-secret-key
  when: not key_exists.stat.exists

- name: Ensure firmware directory
  ansible.builtin.file:
    path: /var/www/firmware
    state: directory
    owner: "{{ freifunk_site }}"
    group: "www-data"

- name: Ensure packages directory
  ansible.builtin.file:
    path: /var/www/packages
    state: directory
    owner: "{{ freifunk_site }}"
    group: "www-data"

- name: "Install deploy.sh"
  become: true
  become_user: "{{ freifunk_site }}"
  ansible.builtin.copy:
    src: "deploy.sh"
    dest: "/mnt/deploy.sh"
    mode: "744"

- name: "Install header.html"
  ansible.builtin.template:
    src: "header.html"
    dest: "/var/www/header.html"
    mode: "644"
    owner: "{{ freifunk_site }}"
    group: "www-data"

- name: Nginx sites config
  ansible.builtin.template:
    src: proxy.conf
    dest: /etc/nginx/sites-available/proxy.conf
  register: nginxconfig

- name: Enable nginx sites config
  ansible.builtin.file:
    src: /etc/nginx/sites-available/proxy.conf
    dest: /etc/nginx/sites-enabled/proxy.conf
    state: link

- name: Delete default config
  ansible.builtin.file:
    state: absent
    path: "{{ item }}"
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/sites-available/default

- name: Test nginx config
  become: true
  ansible.builtin.raw: nginx -t

- name: Restart Nginx
  ansible.builtin.systemd:
    name: nginx.service
    state: restarted
    enabled: true
  when: nginxconfig.changed
