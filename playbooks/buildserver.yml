---

- name: Configure build server
  hosts: "buildserver"
  pre_tasks:
    - name: "Import pre_tasks: reboot-required.yml"
      ansible.builtin.import_tasks: "include/reboot-required.yml"
      tags: [always]
    - name: "Import pre_task etckeeper"
      ansible.builtin.import_tasks: "include/etckeeper_pre.yml"
      tags: [always]
  roles:
    # General
    - { role: ff.networkd, tags: networkd, become: true }
    - { role: ff.certbot, tags: certbot, become: true }
    - { role: ff.firmware_selector, tags: firmware_selector, become: true }
    - { role: ff.buildserver, tags: buildserver, become: true }
  post_tasks:
    - name: "Import post_task etckeeper"
      ansible.builtin.import_tasks: "include/etckeeper_post.yml"
      tags: [always]
