---

- name: Install etckeeper
  become: true
  ansible.builtin.apt:
    update_cache: true
    name: "etckeeper"

- name: Get local username
  delegate_to: localhost
  ansible.builtin.shell: echo $USER@$(hostname)
  register: local_username
  changed_when: false
  tags: [always]
  check_mode: false

- name: Etckeeper pre-commit
  ansible.builtin.shell: >-
    etckeeper commit "pre-commit changes before Ansible runs
    ({{ local_username.stdout }}, tags: {{ ansible_run_tags | join(",") }})"
    || echo "nothing to commit"
  register: pre_result
  changed_when: pre_result.stdout.find('nothing to commit') == -1
  tags: [always]
